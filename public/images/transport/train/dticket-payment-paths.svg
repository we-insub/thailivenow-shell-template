<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" width="640" height="478" role="img" aria-labelledby="t d">
<title id="t">열차표 결제 방법 두 가지</title><desc id="d">카드로 결제하는 경우와 예약번호를 받아 역 매표소에서 결제하는 경우를 비교한 단계도. 두 경우 모두 승차권은 이메일로 발송된다.</desc>
<rect width="640" height="478" rx="16" fill="#fafbfc" stroke="#dde6ea"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#267e89"/></marker></defs><text x="24" y="44" text-anchor="start" font-size="28" font-weight="700" fill="#253545" font-family="system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">결제 방법은 두 가지예요</text><rect x="24" y="66" width="290" height="52" rx="10" fill="#267e89" stroke="#267e89" stroke-width="1.5"/><text x="169.0" y="101.1" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" font-family="system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">카드로 결제</text><rect x="326" y="66" width="290" height="52" rx="10" fill="#267e89" stroke="#267e89" stroke-width="1.5"/><text x="471.0" y="101.1" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" font-family="system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">역에서 결제</text><rect x="24" y="160" width="290" height="78" rx="10" fill="#fff" stroke="#dde6ea" stroke-width="1.5"/><text x="169.0" y="207.05" text-anchor="middle" font-size="23" font-weight="600" fill="#253545" font-family="system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">신용·체크카드로 결제</text><rect x="326" y="160" width="290" height="78" rx="10" fill="#fff" stroke="#dde6ea" stroke-width="1.5"/><text x="471.0" y="207.4" text-anchor="middle" font-size="24" font-weight="600" fill="#253545" font-family="system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">예약번호 받기</text><path d="M169 120 L169 158" stroke="#267e89" stroke-width="3.5" fill="none" marker-end="url(#a)"/><path d="M471 120 L471 158" stroke="#267e89" stroke-width="3.5" fill="none" marker-end="url(#a)"/><rect x="326" y="276" width="290" height="78" rx="10" fill="#fff" stroke="#dde6ea" stroke-width="1.5"/><text x="471.0" y="323.05" text-anchor="middle" font-size="23" font-weight="600" fill="#253545" font-family="system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">역 매표소에서 결제</text><path d="M471 240 L471 274" stroke="#267e89" stroke-width="3.5" fill="none" marker-end="url(#a)"/><rect x="24" y="398" width="592" height="64" rx="10" fill="#eef4f5" stroke="#dde6ea" stroke-width="1.5"/><text x="320.0" y="438.4" text-anchor="middle" font-size="24" font-weight="700" fill="#267e89" font-family="system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">결제가 확인되면 승차권이 이메일로 와요</text><path d="M169 240 L169 396" stroke="#267e89" stroke-width="3.5" fill="none" marker-end="url(#a)"/><path d="M471 356 L471 396" stroke="#267e89" stroke-width="3.5" fill="none" marker-end="url(#a)"/>
</svg>
